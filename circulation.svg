    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24V0H24" fill="none" stroke="#38424e" opacity=".55"/></pattern>
  </defs>
  <rect width="480" height="368" fill="#17202b"/><rect width="480" height="368" fill="url(#grid)"/>
